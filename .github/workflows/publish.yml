# Release pipeline. Build once, `twine check`, then trusted publishing (OIDC) with attestations.
# The PyPI pending publisher must match this repository, the file name publish.yml and the
# environment (`pypi`, or `testpypi` for the rehearsal); register one publisher per index.

name: publish

on:
  push:
    # hatch-vcs derives the version from the tag. A clean vX.Y.Z tag publishes to PyPI;
    # an rc or dev tag rehearses on TestPyPI.
    tags: ["v*"]
  # Manual trigger for a TestPyPI rehearsal without a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs needs the full history and tags, or the build gets the wrong version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.7.22"
      - run: uv build
      # Confirm the wheel and sdist metadata render on PyPI before an upload consumes a version.
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment name is half of the OIDC claim and gates the required reviewer.
    environment: ${{ (github.event_name == 'workflow_dispatch' || contains(github.ref, 'rc') || contains(github.ref, 'dev')) && 'testpypi' || 'pypi' }}
    permissions:
      # Mints the short-lived OIDC token; no PyPI API token is used.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        if: github.event_name == 'push' && !contains(github.ref, 'rc') && !contains(github.ref, 'dev')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' || contains(github.ref, 'rc') || contains(github.ref, 'dev')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
