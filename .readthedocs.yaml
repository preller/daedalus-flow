# Read the Docs build configuration (v2).
# Mirrors the local `just docs` discipline: uv-synced docs group, fail on warning.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12" # daedalus requires-python >=3.12; 3.12 validated

python:
  install:
    - method: uv
      command: sync # respects uv.lock
      groups:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true # mirror the -W discipline on RTD too

formats:
  - htmlzip
